name: catalog-check

# The university's rule as a required check: a lesson is in catalog/ only if results/ shows it shipped.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests of the check
        run: node --test tests/*.test.mjs
      - name: Every catalog lesson has a shipping result
        run: node .github/scripts/check-catalog.mjs
