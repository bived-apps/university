name: bive-tests

on:
  push:
    branches: [main, bived, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Every catalog lesson has a shipping result
        run: node .github/scripts/check-catalog.mjs
